<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#090709" name="theme-color"/><title>Producto — YORU STUDIO</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="./css/style.css">
</head><body>
<div class="bg-global" style="background-image: url('./assets/yoru-morada.png');"></div>

<header class="nav" id="nav">
  <div class="wrap">
    <div class="nav-top">
      <a class="logo" href="index.html"><span class="logo-mark">夜</span><span>YORU STUDIO</span></a>
      <div class="nav-actions">
        <select class="nav-btn"><option>ES · MXN</option><option>EN · USD</option></select>
        <!-- El botón ahora llama a la función checkoutWhatsApp si haces clic -->
        <button class="nav-btn cart" onclick="checkoutWhatsApp()">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg> 
          <span id="cart-count">0</span>
        </button>
        <button class="nav-btn" id="menuBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
      </div>
    </div>
    <div class="menu-dropdown" id="menu">
      <a href="index.html">Inicio</a>
      <a href="proyectos-gaming.html">Volver a Gaming</a>
      <a href="https://wa.me/525664921229" class="btn-contact">Contacto</a>
    </div>
  </div>
</header>

<main class="main-content product-page">
  <div class="wrap">
    <div class="product-main">
      <div class="product-image-container">
        <div class="watermark-layer" style="opacity: 0.8;"></div>
        <img id="prod-img" src="" alt="Producto" oncontextmenu="return false;">
      </div>
      
      <div class="product-details">
        <span class="category-tag">Gaming y Streamers</span>
        <h1 id="prod-title">Cargando...</h1>
        <p class="desc" id="prod-desc">Cargando información...</p>
        <div class="price" id="prod-price">$0 MXN</div>
        
        <!-- Botón que llama a addToCart -->
        <button class="btn" id="add-btn" style="width: 100%; justify-content: center; padding: 15px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          AÑADIR AL CARRITO
        </button>
      </div>
    </div>

    <div class="suggestions-section">
      <h3>También te podría interesar</h3>
      <div class="shop-grid" id="suggestions-container"></div>
    </div>
  </div>
</main>

<footer class="footer"><div class="wrap footer-inner"><div>© 2026 YORU STUDIO. Todos los derechos reservados.</div></div></footer>

<script src="./js/main.js"></script>
<script>
  const catalogData = [
    { id: "cartoons", title: "Banners Cartoons", desc: "Pack de banners con estilo cartoons, ideal para streams de variedad.", price: "$250 MXN", img: "./assets/proyecto-gamer-1.jpg" },
    { id: "donato", title: "Banners The Donato", desc: "Pack de banners estilo urbano/gamer con colores neón.", price: "$250 MXN", img: "./assets/proyecto-gamer-2.png" },
    { id: "rick", title: "Banners Rick & Morty", desc: "Pack de banners con temática sci-fi y portal verde.", price: "$250 MXN", img: "./assets/proyecto-gamer-3.jpg" }
  ];

  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');
  const currentProduct = catalogData.find(p => p.id === productId);

  if (currentProduct) {
    document.getElementById('prod-title').textContent = currentProduct.title;
    document.getElementById('prod-desc').textContent = currentProduct.desc;
    document.getElementById('prod-price').textContent = currentProduct.price;
    document.getElementById('prod-img').src = currentProduct.img;
    document.title = currentProduct.title + " — YORU STUDIO";

    // Evento del botón Añadir al carrito
    document.getElementById('add-btn').addEventListener('click', () => {
      addToCart(currentProduct.id, currentProduct.title, currentProduct.price, currentProduct.img);
    });

    // Sugerencias
    let otherProducts = catalogData.filter(p => p.id !== productId);
    otherProducts.sort(() => 0.5 - Math.random());
    const suggestions = otherProducts.slice(0, 2);
    
    const suggestionsContainer = document.getElementById('suggestions-container');
    suggestions.forEach(prod => {
      suggestionsContainer.innerHTML += `
        <div class="shop-card">
          <div class="shop-img-wrapper">
            <div class="watermark-layer"></div>
            <img src="${prod.img}" alt="${prod.title}" oncontextmenu="return false;">
          </div>
          <div class="shop-info">
            <h3 class="shop-title">${prod.title}</h3>
            <div class="shop-price">${prod.price}</div>
            <a href="producto.html?id=${prod.id}" class="shop-btn" style="text-decoration:none;">Ver producto</a>
          </div>
        </div>
      `;
    });
  } else {
    document.getElementById('prod-title').textContent = "Producto no encontrado";
  }
</script>
</body></html>
